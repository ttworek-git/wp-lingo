<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script>var ERR=0;window.onerror=function(m,s,l){if(ERR++)return;var f=(s||"").split("/").pop().split("?")[0]||"index.html";document.documentElement.innerHTML='<body style="padding:20px;font:16px sans-serif;color:#c00"><b>Fehler in Datei '+f+', Zeile '+l+':</b><br>'+m+'<br><br>Bitte genau diese Datei neu einfügen.</body>';};</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WP-Lingo">
<title>WP-Lingo</title>
<style>
:root{--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--rd:#ea2b2b;--line:#e5e5e5;--txt:#3c3c3c}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--txt)}
#app{max-width:640px;margin:0 auto;padding:12px 16px 220px;min-height:100vh}
.hud{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:8px 4px 12px;position:sticky;top:0;background:#fff;z-index:5}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border:2px solid var(--line);border-radius:14px;padding:8px 2px;background:#fff;font-weight:700;cursor:pointer;font-size:13px;line-height:1.35;color:var(--txt)}
.tab.on{border-color:var(--c);background:var(--c);color:#fff}
.banner{background:var(--c);color:#fff;border-radius:18px;padding:16px;margin:14px 0 30px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.banner h2{margin:0 0 6px;font-size:19px}
.banner .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.bar{background:var(--line);border-radius:99px;height:14px;overflow:hidden;flex:1}
.bar>div{background:var(--g);height:100%;border-radius:99px;transition:width .4s}
.banner .bar{background:rgba(255,255,255,.35)}.banner .bar>div{background:#fff}
.path{display:flex;flex-direction:column;align-items:center;gap:26px}
.node{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.circle{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .08s}
.node:active .circle{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.node.locked .circle{background:var(--line);box-shadow:0 7px 0 #c8c8c8}
.lbl{margin-top:12px;font-weight:700;text-align:center;max-width:230px;font-size:15px}
.lbl small{display:block;font-weight:500;color:#888;margin-top:2px}
.btn{background:var(--g);color:#fff;border:none;border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--gd);text-transform:uppercase;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn:disabled{background:var(--line);color:#afafaf;box-shadow:0 4px 0 #ccc;cursor:default;transform:none}
.btn.sec{background:#fff;color:#1cb0f6;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.btn.white{background:#fff;color:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.2);padding:9px 14px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{flex:1;max-width:160px;background:none;border:none;padding:10px 4px 14px;font-size:22px;cursor:pointer;color:#999;font-weight:700}
.nav button small{display:block;font-size:12px;margin-top:2px}
.nav button.on{color:#1cb0f6}
.badge{background:var(--r);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px}
.top{display:flex;align-items:center;gap:14px;padding-top:6px}
.x{background:none;border:none;font-size:24px;cursor:pointer;color:#afafaf}
.hh{font-weight:800;color:#999}
.card{margin-top:24px}
.tag{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.q{font-size:20px;line-height:1.4;margin:10px 0 0}
.hintbtn{background:#fff;border:2px solid #ffc800;color:#cd7900;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;margin-top:14px;font-size:14px}
.hint{background:#fff8db;border:2px solid #ffc800;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px;scroll-margin-top:70px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--line);line-height:1.35}
.key{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#999;background:#fff}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;box-shadow:0 3px 0 #84d8ff}
.opt.sel .key{border-color:#84d8ff;color:#1cb0f6}
.opt.right{border-color:var(--g);background:#d7ffb8;box-shadow:0 3px 0 var(--g);cursor:default}
.opt.wrongsel{border-color:var(--r);background:#ffdfe0;box-shadow:0 3px 0 var(--r);cursor:default}
.opt.dim{background:#fafafa;cursor:default}
.why{margin-top:8px;font-size:14px;line-height:1.5;color:#4b4b4b}
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff;padding:14px 16px}
.fi{max-width:640px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kbd{color:#aaa;font-size:12px}
.foot.ok{background:#d7ffb8;border-color:#d7ffb8}.foot.ok h3{color:#58a700}
.foot.bad{background:#ffdfe0;border-color:#ffdfe0}.foot.bad h3{color:var(--rd)}
.foot.bad .btn{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.msg{flex:1;min-width:240px;max-height:32vh;overflow:auto}.msg h3{margin:0 0 4px}.msg p{margin:3px 0;font-size:14px;line-height:1.45}
.end{text-align:center;padding-top:50px}.end .big{font-size:76px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.statgrid>div{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}.statgrid b{display:block;font-size:22px}.statgrid small{color:#888}
.col{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:24px auto 0}
.sc{border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:12px 14px;margin:12px 0}
.sc h3{margin:0 0 8px;font-size:16px}
.srow{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.srow .bar{height:10px}
.set{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:15px}
.setbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.setbtns .btn{font-size:13px;padding:10px 14px}
.sv{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px;background:#fafafa;font-size:14px;line-height:1.55}
.sv summary{font-weight:800;cursor:pointer}
.sv table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.sv td,.sv th{border:1px solid #ddd;padding:5px 8px;text-align:right}
.sv td:first-child,.sv th:first-child{text-align:left}
.zw{background:#f1f9ff;border:2px solid #cfeaff;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:13px;line-height:1.6}
.casecard{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:14px;margin:12px 0;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.casecard .ci{font-size:30px}.casecard small{display:block;color:#888;margin-top:3px}
.casecard .arr{margin-left:auto;font-size:26px;color:#bbb}
@media(max-width:600px){.kbd{display:none}.fi .btn{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script src="daten-bwl.js" charset="UTF-8"></script>
<script src="daten-steuer.js" charset="UTF-8"></script>
<script src="daten-recht.js" charset="UTF-8"></script>
<script src="faelle.js" charset="UTF-8"></script>
<script>
// ===== WP-Lingo App (Inhalte liegen in daten-bwl.js, daten-steuer.js, daten-recht.js, faelle.js) =====
var miss=[];
if(typeof BWL==="undefined")miss.push("daten-bwl.js");
if(typeof STEUER==="undefined")miss.push("daten-steuer.js");
if(typeof RECHT==="undefined")miss.push("daten-recht.js");
if(typeof FAELLE==="undefined")miss.push("faelle.js");
const C=[
 {title:"Angewandte BWL & VWL",short:"BWL / VWL",color:"#a560e8",icon:"📈",lessons:typeof BWL!=="undefined"?BWL:[]},
 {title:"Steuerrecht",short:"Steuerrecht",color:"#1cb0f6",icon:"💶",lessons:typeof STEUER!=="undefined"?STEUER:[]},
 {title:"Wirtschaftsrecht",short:"Wirtschaftsrecht",color:"#ff9600",icon:"⚖️",lessons:typeof RECHT!=="undefined"?RECHT:[]}
];
const CASES=typeof FAELLE!=="undefined"?FAELLE:[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$("#app");
const KEY="wplingo-v2", GOAL=30, IV=[0,1,2,4,8,16,32], DAY=864e5;
let tab=0, L=null, K=null;
const today=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString("sv")};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>n.toLocaleString("de-DE");
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return(h>>>0).toString(36)};
C.forEach((c,ci)=>c.lessons.forEach((l,li)=>l.qs.forEach(q=>{q.id=hash(q.q);q.ci=ci;q.li=li})));
const ALL=C.flatMap(c=>c.lessons.flatMap(l=>l.qs));
CASES.forEach(f=>{f.ci=C.findIndex(c=>c.short===f.area)});

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
const S=Object.assign({xp:0,streak:0,lastDay:null,cards:{},done:{},dayXp:0,xpDay:today(),unlockAll:false,cases:{}},load());
if(!S.cases)S.cases={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dayCheck(){if(S.xpDay!==today()){S.xpDay=today();S.dayXp=0}}
const streakNow=()=>(S.lastDay===today()||S.lastDay===today(-1))?S.streak:0;
const box=q=>(S.cards[q.id]||{}).box||0;
const pct=qs=>qs.length?Math.round(qs.reduce((s,q)=>s+box(q),0)/(qs.length*(IV.length-1))*100):0;
const dueList=()=>ALL.filter(q=>S.cards[q.id]&&S.cards[q.id].due<=Date.now());
function grade(q,ok,hint){const b=ok?(hint?Math.max(box(q),1):Math.min(box(q)+1,IV.length-1)):0;S.cards[q.id]={box:b,due:Date.now()+IV[b]*DAY}}
function addXp(x){dayCheck();S.xp+=x;S.dayXp+=x;if(S.lastDay!==today()){S.streak=S.lastDay===today(-1)?S.streak+1:1;S.lastDay=today()}}

function hud(){dayCheck();return`<div class="hud"><span>🔥 ${streakNow()}</span><span>💎 ${fmt(S.xp)} XP</span><span>🎯 ${Math.min(S.dayXp,GOAL)}/${GOAL}</span></div>`}
function tabs(fn){return`<div class="tabs">${C.map((x,i)=>`<button class="tab ${i===tab?"on":""}" style="--c:${x.color}" onclick="tab=${i};${fn}()">${x.icon}<br>${x.short}</button>`).join("")}</div>`}
function nav(a){const d=dueList().length;return`<nav class="nav">
<button class="${a==="learn"?"on":""}" onclick="home()">🏠<small>Lernen</small></button>
<button class="${a==="cases"?"on":""}" onclick="cases()">📝<small>Fälle</small></button>
<button class="${a==="review"?"on":""}" onclick="review()">🔁<small>Wiederholen${d?`<span class="badge">${d}</span>`:""}</small></button>
<button class="${a==="stats"?"on":""}" onclick="stats()">📊<small>Statistik</small></button></nav>`}

function home(){
  L=null;K=null;const c=C[tab],offs=[0,60,85,60,0,-60,-85,-60];
  app.innerHTML=hud()+tabs("home")+`
  <div class="banner" style="--c:${c.color}"><h2>${c.title}</h2><div>${pct(c.lessons.flatMap(l=>l.qs))} % gemeistert · ${c.lessons.reduce((s,l)=>s+l.qs.length,0)} Fragen</div>
  <div class="row"><span>🎯 ${Math.min(S.dayXp,GOAL)}/${GOAL} XP</span><div class="bar"><div style="width:${Math.min(100,S.dayXp/GOAL*100)}%"></div></div><button class="btn white" onclick="mix(${tab})">🎲 Mix</button></div></div>
  <div class="path">${c.lessons.map((l,li)=>{const n=S.done[tab+"-"+li]||0,open=S.unlockAll||li===0||!!S.done[tab+"-"+(li-1)];
    return`<div class="node ${open?"":"locked"}" style="--c:${c.color};transform:translateX(${offs[li%8]}px)" onclick="tryStart(${tab},${li},${open})"><div class="circle">${open?(n?"⭐":l.icon):"🔒"}</div><div class="lbl">${l.title}<small>${n?n+"× geschafft · ":""}${pct(l.qs)} % · ${l.qs.length} Fragen</small></div></div>`}).join("")}</div>`+nav("learn");
  window.scrollTo(0,0);
}
function tryStart(ci,li,open){if(!open&&!confirm("Diese Lektion ist noch gesperrt. Trotzdem starten?"))return;start(ci,li)}
function start(ci,li){const qs=shuffle([...C[ci].lessons[li].qs]).sort((a,b)=>box(a)-box(b)).slice(0,8);begin(shuffle(qs),"lesson",ci,li)}
function mix(ci){begin(shuffle(C[ci].lessons.flatMap(l=>[...l.qs])).slice(0,10),"mix",ci,null)}
function review(){
  K=null;
  let qs=dueList().sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  if(!qs.length)qs=ALL.filter(q=>S.cards[q.id]).sort((a,b)=>box(a)-box(b));
  if(!qs.length){L=null;app.innerHTML=hud()+`<div class="end"><div class="big">📚</div><h2>Noch nichts zu wiederholen</h2><p>Starte zuerst ein paar Lektionen. Fällige und falsch beantwortete Fragen landen dann automatisch hier.</p><div class="col"><button class="btn" onclick="home()">Zu den Lektionen</button></div></div>`+nav("review");return}
  begin(shuffle(qs.slice(0,10)),"review",null,null);
}
function begin(qs,mode,ci,li){K=null;L={mode,ci,li,queue:qs,total:qs.length,done:0,mistakes:0,firstWrong:0,hinted:0,seen:new Set()};renderQ()}

function renderQ(){
  const q=L.queue[0];L.sel=null;L.checked=false;L.hint=false;
  const c=C[q.ci],ord=shuffle(q.o.map((_,i)=>i));
  app.innerHTML=`<div class="top"><button class="x" onclick="quit()">✕</button><div class="bar"><div style="width:${L.done/L.total*100}%"></div></div><span class="hh">${L.done}/${L.total}</span></div>
  <div class="card"><div class="tag" style="color:${c.color}">${c.icon} ${c.lessons[q.li].title}</div><h2 class="q">${q.q}</h2>
  <button id="hb" class="hintbtn" onclick="showHint()">💡 Tipp zur Herangehensweise</button><div id="hint" class="hint" hidden>💡 <b>Herangehensweise:</b> ${q.h}</div>
  <div class="opts">${ord.map((i,k)=>`<div class="opt" data-v="${i}"><span class="key">${"ABCDE"[k]}</span><div><div>${q.o[i][0]}</div><div class="why" hidden></div></div></div>`).join("")}</div></div>
  <div id="foot" class="foot"><div class="fi"><span class="kbd">Tasten: 1–4 wählen · H Tipp · Enter prüfen</span><button id="chk" class="btn" disabled onclick="check()">Prüfen</button></div></div>`;
  $$(".opt").forEach(b=>b.onclick=()=>pickOpt(b));
  window.scrollTo(0,0);
}
function pickOpt(b){if(!L||L.checked)return;$$(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");L.sel=+b.dataset.v;$("#chk").disabled=false}
function showHint(){const h=$("#hint");if(!L||!h)return;h.hidden=false;$("#hb").hidden=true;if(!L.checked)L.hint=true}

function check(){
  if(!L||L.checked||L.sel===null)return;
  const q=L.queue[0];L.checked=true;const ok=L.sel===0;
  $$(".opt").forEach(b=>{const v=+b.dataset.v,w=b.querySelector(".why");
    b.classList.remove("sel");b.classList.add(v===0?"right":v===L.sel?"wrongsel":"dim");
    w.innerHTML=`<b>${v===0?"✅ Stimmt:":"❌ Passt nicht:"}</b> ${q.o[v][1]}`;w.hidden=false});
  if(!L.seen.has(q.id)){L.seen.add(q.id);grade(q,ok,L.hint);if(!ok)L.firstWrong++;else if(L.hint)L.hinted++}
  if(ok){L.done++;L.queue.shift()}
  else{L.mistakes++;L.queue.push(L.queue.shift())}
  save();
  const f=$("#foot");f.className="foot "+(ok?"ok":"bad");
  f.innerHTML=`<div class="fi"><div class="msg"><h3>${ok?pick(["Richtig! ✅","Super! 🎉","Klasse! 💪","Genau! 🎯"]):"Leider falsch ❌ – die Frage kommt nochmal"}</h3>${q.n?`<p>📌 <b>Merke:</b> ${q.n}</p>`:""}<p style="color:#777">Begründungen zu allen Antworten stehen oben bei den Optionen.</p></div><button class="btn" onclick="next()">Weiter</button></div>`;
  $(".top .bar>div").style.width=(L.done/L.total*100)+"%";
  const hh=$(".hh");if(hh)hh.textContent=L.done+"/"+L.total;
  $(".opts").scrollIntoView({behavior:"smooth",block:"start"});
}
function next(){if(!L.queue.length)return end();renderQ()}
function quit(){if(confirm("Lektion wirklich abbrechen?"))home()}

function end(){
  const m=L.mode,firstOk=L.total-L.firstWrong;
  const xp=(m==="review"?5:10)+(firstOk-L.hinted)*2+L.hinted+(L.firstWrong||L.hinted?0:5);
  addXp(xp);
  if(m==="lesson"){const k=L.ci+"-"+L.li;S.done[k]=(S.done[k]||0)+1}
  save();
  const acc=Math.round(firstOk/L.total*100);
  app.innerHTML=`<div class="end"><div class="big">${acc===100&&!L.hinted?"🏆":"🎉"}</div><h1>${m==="review"?"Wiederholung geschafft!":"Lektion geschafft!"}</h1>
  <div class="statgrid"><div><b>+${xp}</b><small>XP</small></div><div><b>${acc} %</b><small>auf Anhieb richtig</small></div><div><b>💡 ${L.hinted}</b><small>mit Tipp</small></div></div>
  <div class="col"><button class="btn" onclick="home()">Weiter</button><button class="btn sec" onclick="review()">🔁 Wiederholen</button></div></div>`;
  L=null;
}

function stats(){
  L=null;K=null;const seen=ALL.filter(q=>S.cards[q.id]).length;
  app.innerHTML=hud()+`<h2>📊 Dein Fortschritt</h2><div class="statgrid"><div><b>${fmt(S.xp)}</b><small>XP gesamt</small></div><div><b>🔥 ${streakNow()}</b><small>Tage in Folge</small></div><div><b>${seen}/${ALL.length}</b><small>Fragen gesehen</small></div></div>
  ${C.map(c=>`<div class="sc" style="--c:${c.color}"><h3>${c.icon} ${c.title}</h3>${c.lessons.map(l=>`<div class="srow"><span>${l.title}</span><div class="bar"><div style="width:${pct(l.qs)}%;background:${c.color}"></div></div><b>${pct(l.qs)} %</b></div>`).join("")}</div>`).join("")}
  <h3>⚙️ Einstellungen</h3>
  <label class="set"><input type="checkbox" ${S.unlockAll?"checked":""} onchange="S.unlockAll=this.checked;save()"> Alle Lektionen freischalten</label>
  <div class="setbtns"><button class="btn sec" onclick="exportData()">Fortschritt exportieren</button><button class="btn sec" onclick="importData()">Importieren</button><button class="btn red" onclick="resetAll()">Alles zurücksetzen</button></div>
  <p style="color:#999;font-size:12px;margin-top:24px">„% gemeistert“ steigt, je öfter du eine Frage hintereinander ohne Tipp richtig beantwortest. Wiederholt wird nach 1, 2, 4, 8, 16 und 32 Tagen. Eine falsche Antwort setzt die Frage zurück, mit Tipp richtig beantwortete Fragen kommen früher wieder.</p>`+nav("stats");
}
function exportData(){prompt("Kopiere diesen Code und füge ihn auf dem anderen Gerät unter „Importieren“ ein:",JSON.stringify(S))}
function importData(){const t=prompt("Fortschritts-Code hier einfügen:");if(!t)return;try{Object.assign(S,JSON.parse(t));save();stats();alert("Fortschritt importiert ✔")}catch(e){alert("Der Code ist ungültig.")}}
function resetAll(){if(confirm("Wirklich den gesamten Fortschritt löschen?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}

// ===== Klausurfälle =====
function cases(){
  L=null;K=null;const c=C[tab],list=CASES.filter(f=>f.ci===tab);
  app.innerHTML=hud()+tabs("cases")+`
  <div class="banner" style="--c:${c.color}"><h2>📝 Klausurfälle</h2><div>Mehrstufige Fälle wie in der Klausur. Nach jedem Schritt siehst du die richtige Lösung und rechnest mit dem korrekten Zwischenergebnis weiter.</div></div>
  ${list.length?list.map(f=>{const b=S.cases[f.id];return`<div class="casecard" style="--c:${c.color}" onclick="startCase('${f.id}')"><div class="ci">${f.icon}</div><div><b>${f.title}</b><small>${f.topic} · ${f.steps.length} Schritte${b!==undefined?` · Bestwert ${b}/${f.steps.length}`:""}</small></div><span class="arr">›</span></div>`}).join(""):"<p>Für dieses Kapitel gibt es noch keine Fälle.</p>"}`+nav("cases");
  window.scrollTo(0,0);
}
function startCase(id){const f=CASES.find(x=>x.id===id);if(!f)return;L=null;K={f,i:0,res:[],sel:null,checked:false,hint:false};renderStep()}
function renderStep(){
  const f=K.f,st=f.steps[K.i],c=C[f.ci],ord=shuffle(st.o.map((_,i)=>i));
  K.sel=null;K.checked=false;K.hint=false;
  app.innerHTML=`<div class="top"><button class="x" onclick="quitCase()">✕</button><div class="bar"><div style="width:${K.i/f.steps.length*100}%"></div></div><span class="hh" style="color:${c.color}">${K.i+1}/${f.steps.length}</span></div>
  <details class="sv" ${K.i===0?"open":""}><summary>📄 Sachverhalt: ${f.title}${K.i>0?" (antippen zum Aufklappen)":""}</summary><div style="margin-top:8px">${f.sv}</div></details>
  ${K.res.length?`<div class="zw"><b>Bisherige Ergebnisse:</b>${K.res.map((r,j)=>`<div>${r.ok?"✅":"❌"} ${j+1}. ${f.steps[j].o[0][0]}</div>`).join("")}</div>`:""}
  <div class="card"><div class="tag" style="color:${c.color}">${f.icon} Schritt ${K.i+1} von ${f.steps.length}</div><h2 class="q">${st.q}</h2>
  <button id="hb" class="hintbtn" onclick="hintStep()">💡 Tipp zur Herangehensweise</button><div id="hint" class="hint" hidden>💡 <b>Herangehensweise:</b> ${st.h}</div>
  <div class="opts">${ord.map((i,k)=>`<div class="opt" data-v="${i}"><span class="key">${"ABCDE"[k]}</span><div><div>${st.o[i][0]}</div><div class="why" hidden></div></div></div>`).join("")}</div></div>
  <div id="foot" class="foot"><div class="fi"><span class="kbd">Tasten: 1–4 wählen · H Tipp · Enter prüfen</span><button id="chk" class="btn" disabled onclick="checkStep()">Prüfen</button></div></div>`;
  $$(".opt").forEach(b=>b.onclick=()=>pickStep(b));
  window.scrollTo(0,0);
}
function pickStep(b){if(!K||K.checked)return;$$(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");K.sel=+b.dataset.v;$("#chk").disabled=false}
function hintStep(){const h=$("#hint");if(!K||!h)return;h.hidden=false;$("#hb").hidden=true;if(!K.checked)K.hint=true}
function checkStep(){
  if(!K||K.checked||K.sel===null)return;
  const st=K.f.steps[K.i];K.checked=true;const ok=K.sel===0;
  $$(".opt").forEach(b=>{const v=+b.dataset.v,w=b.querySelector(".why");
    b.classList.remove("sel");b.classList.add(v===0?"right":v===K.sel?"wrongsel":"dim");
    w.innerHTML=`<b>${v===0?"✅ Stimmt:":"❌ Passt nicht:"}</b> ${st.o[v][1]}`;w.hidden=false});
  K.res.push({ok,hint:K.hint});
  const last=K.i+1>=K.f.steps.length,f=$("#foot");f.className="foot "+(ok?"ok":"bad");
  f.innerHTML=`<div class="fi"><div class="msg"><h3>${ok?pick(["Richtig! ✅","Super! 🎉","Klasse! 💪","Genau! 🎯"]):"Leider falsch ❌"}</h3>${ok?"":`<p><b>Richtig ist:</b> ${st.o[0][0]}. Damit geht es weiter.</p>`}${st.n?`<p>📌 <b>Merke:</b> ${st.n}</p>`:""}</div><button class="btn" onclick="nextStep()">${last?"Auswertung":"Nächster Schritt"}</button></div>`;
  $(".top .bar>div").style.width=((K.i+1)/K.f.steps.length*100)+"%";
  $(".opts").scrollIntoView({behavior:"smooth",block:"start"});
}
function nextStep(){if(!K)return;K.i++;if(K.i>=K.f.steps.length)return endCase();renderStep()}
function quitCase(){if(confirm("Fall wirklich abbrechen?"))cases()}
function endCase(){
  const f=K.f,n=f.steps.length,sc=K.res.filter(r=>r.ok).length,hints=K.res.filter(r=>r.hint).length;
  let xp=0;K.res.forEach(r=>{if(r.ok)xp+=r.hint?2:4});if(K.res.every(r=>r.ok&&!r.hint))xp+=10;
  if(xp)addXp(xp);
  S.cases[f.id]=Math.max(S.cases[f.id]||0,sc);save();
  const c=C[f.ci];
  app.innerHTML=`<div class="end" style="padding-top:30px"><div class="big">${sc===n?"🏆":sc>=n/2?"🎉":"📚"}</div><h1>Fall abgeschlossen</h1>
  <div class="statgrid"><div><b>${sc}/${n}</b><small>Schritte richtig</small></div><div><b>+${xp}</b><small>XP</small></div><div><b>💡 ${hints}</b><small>Tipps genutzt</small></div></div></div>
  <div class="sc" style="--c:${c.color}"><h3>📋 Lösungsübersicht: ${f.title}</h3>${f.steps.map((s,j)=>`<p style="font-size:14px;margin:10px 0;line-height:1.45">${K.res[j].ok?"✅":"❌"} <b>${j+1}.</b> ${s.q}<br>→ <b>${s.o[0][0]}</b><br><span style="color:#777">${s.o[0][1]}</span></p>`).join("")}</div>
  <div class="col"><button class="btn" onclick="cases()">Weiter</button><button class="btn sec" onclick="startCase('${f.id}')">Fall wiederholen</button></div>`;
  K=null;window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  const st=L||K;if(!st)return;
  if(/^[1-5]$/.test(e.key)&&!st.checked){const b=$$(".opt")[+e.key-1];if(b){if(L)pickOpt(b);else pickStep(b)}}
  else if(e.key.toLowerCase()==="h"){if(L)showHint();else hintStep()}
  else if(e.key==="Enter"){const b=$("#foot .btn");if(b&&!b.disabled){e.preventDefault();b.click()}}
});

if(miss.length){app.innerHTML='<div style="padding:20px;font-size:16px;line-height:1.5;color:#c00"><b>Diese Datei(en) fehlen oder sind fehlerhaft:</b><br>'+miss.join("<br>")+'<br><br>Bitte bei GitHub prüfen, ob die Datei genau so heißt (kleingeschrieben) und vollständig ist (letzte Zeile: <b>];</b>).</div>'}
else home();
</script>
</body>
</html>
