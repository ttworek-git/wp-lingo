<style>
:root{--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--rd:#ea2b2b;--line:#e5e5e5;--txt:#3c3c3c}
{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--txt)}
#app{max-width:640px;margin:0 auto;padding:12px 16px 220px;min-height:100vh}
.hud{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:8px 4px 12px;position:sticky;top:0;background:#fff;z-index:5}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tab{border:2px solid var(--line);border-radius:14px;padding:10px 4px;background:#fff;font-weight:700;cursor:pointer;font-size:14px;color:var(--txt)}
.tab.on{border-color:var(--c);background:var(--c);color:#fff}
.banner{background:var(--c);color:#fff;border-radius:18px;padding:16px;margin:14px 0 30px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.banner h2{margin:0 0 6px;font-size:19px}
.banner .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.bar{background:var(--line);border-radius:99px;height:14px;overflow:hidden;flex:1}
.bar>div{background:var(--g);height:100%;border-radius:99px;transition:width .4s}
.banner .bar{background:rgba(255,255,255,.35)}.banner .bar>div{background:#fff}
.path{display:flex;flex-direction:column;align-items:center;gap:26px}
.node{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.circle{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .08s}
.node:active .circle{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.node.locked .circle{background:var(--line);box-shadow:0 7px 0 #c8c8c8}
.lbl{margin-top:12px;font-weight:700;text-align:center;max-width:230px;font-size:15px}
.lbl small{display:block;font-weight:500;color:#888;margin-top:2px}
.btn{background:var(--g);color:#fff;border:none;border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--gd);text-transform:uppercase;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn:disabled{background:var(--line);color:#afafaf;box-shadow:0 4px 0 #ccc;cursor:default;transform:none}
.btn.sec{background:#fff;color:#1cb0f6;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.btn.white{background:#fff;color:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.2);padding:9px 14px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{flex:1;max-width:213px;background:none;border:none;padding:10px 4px 14px;font-size:22px;cursor:pointer;color:#999;font-weight:700}
.nav button small{display:block;font-size:12px;margin-top:2px}
.nav button.on{color:#1cb0f6}
.badge{background:var(--r);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px}
.top{display:flex;align-items:center;gap:14px;padding-top:6px}
.x{background:none;border:none;font-size:24px;cursor:pointer;color:#afafaf}
.hh{font-weight:800;color:var(--r)}
.card{margin-top:24px}
.tag{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.q{font-size:20px;line-height:1.4;margin:10px 0 0}
.hintbtn{background:#fff;border:2px solid #ffc800;color:#cd7900;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;margin-top:14px;font-size:14px}
.hint{background:#fff8db;border:2px solid #ffc800;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px;scroll-margin-top:70px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--line);line-height:1.35}
.key{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#999;background:#fff}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;box-shadow:0 3px 0 #84d8ff}
.opt.sel .key{border-color:#84d8ff;color:#1cb0f6}
.opt.right{border-color:var(--g);background:#d7ffb8;box-shadow:0 3px 0 var(--g);cursor:default}
.opt.wrongsel{border-color:var(--r);background:#ffdfe0;box-shadow:0 3px 0 var(--r);cursor:default}
.opt.dim{background:#fafafa;cursor:default}
.why{margin-top:8px;font-size:14px;line-height:1.5;color:#4b4b4b}
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff;padding:14px 16px}
.fi{max-width:640px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kbd{color:#aaa;font-size:12px}
.foot.ok{background:#d7ffb8;border-color:#d7ffb8}.foot.ok h3{color:#58a700}
.foot.bad{background:#ffdfe0;border-color:#ffdfe0}.foot.bad h3{color:var(--rd)}
.foot.bad .btn{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.msg{flex:1;min-width:240px;max-height:32vh;overflow:auto}.msg h3{margin:0 0 4px}.msg p{margin:3px 0;font-size:14px;line-height:1.45}
.end{text-align:center;padding-top:50px}.end .big{font-size:76px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.statgrid>div{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}.statgrid b{display:block;font-size:22px}.statgrid small{color:#888}
.col{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:24px auto 0}
.sc{border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:12px 14px;margin:12px 0}
.sc h3{margin:0 0 8px;font-size:16px}
.srow{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.srow .bar{height:10px}
.set{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:15px}
.setbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.setbtns .btn{font-size:13px;padding:10px 14px}
@media(max-width:600px){.kbd{display:none}.fi .btn{width:100%}}
</style>
</head>

<script>

Aufbau einer Frage:

WICHTIG: Die ERSTE Option ist immer die richtige – die App mischt automatisch.

const C = [
{ title:"Angewandte BWL & VWL", short:"BWL / VWL", color:"#a560e8", icon:"📈", lessons:[
{ title:"Kostenrechnung & Kalkulation", icon:"🧮", qs:[
{q:"Zuschlagskalkulation: Materialeinzelkosten 200 €, MGK-Zuschlag 10 %, Fertigungslöhne 100 €, FGK-Zuschlag 150 %. Wie hoch sind die Herstellkosten?",
h:"Baue das Schema stufenweise auf: Materialkosten = MEK + MGK, Fertigungskosten = FEK + FGK. Jeder Zuschlagssatz bezieht sich nur auf seine eigene Einzelkostenbasis.",
o:[["470 €","MK = 200 + 20 = 220 €; FK = 100 + 150 = 250 €; HK = 470 €."],
["450 €","Hier fehlen die Materialgemeinkosten (10 % von 200 € = 20 €)."],
["320 €","Hier fehlen die Fertigungsgemeinkosten (150 % von 100 € = 150 €)."],
["770 €","Der FGK-Zuschlag wurde fälschlich auf MEK + FEK (300 €) bezogen. Basis sind nur die Fertigungslöhne."]],
n:"HK = MEK + MGK + FEK + FGK (+ SEKF). Selbstkosten = HK + VwGK + VtGK."},
{q:"Welche der folgenden Positionen sind Zusatzkosten?",
h:"Frag dich, ob es in der Finanzbuchhaltung überhaupt einen Aufwand dazu gibt. Zusatzkosten haben kein Aufwands-Gegenstück, Anderskosten einen Aufwand in anderer Höhe.",
o:[["Kalkulatorischer Unternehmerlohn im Einzelunternehmen","Der Unternehmer erhält kein Gehalt, in der FiBu gibt es also keinen Aufwand. Die Kosten kommen nur in der KLR hinzu."],
["Kalkulatorische Abschreibungen","Bilanzielle AfA gibt es auch, nur in anderer Höhe (z. B. auf Wiederbeschaffungswerte). Das sind Anderskosten."],
["Spende an einen Sportverein","Betriebsfremd, also neutraler Aufwand und keine Kosten."],
["Fertigungslöhne","Aufwand und Kosten sind gleich hoch. Das sind Grundkosten."]],
n:"Kalkulatorische Kosten = Anderskosten (z. B. kalk. AfA, Wagnisse) + Zusatzkosten (z. B. Unternehmerlohn, EK-Zinsen, Miete für eigene Räume)."},
{q:"Kalk. AfA 40.000 €, kalk. Zinsen 10.000 €, Energie 15.000 €, Raumkosten 5.000 €, Maschinenlaufzeit 1.750 h. Wie hoch ist der Maschinenstundensatz?",
h:"Summiere alle maschinenabhängigen Gemeinkosten und teile sie durch die Laufzeit (nicht durch Kalender- oder Anwesenheitsstunden).",
o:[["40,00 €/h","70.000 € / 1.750 h = 40 €/h."],
["28,57 €/h","Nur AfA und Zinsen. Energie und Raumkosten hängen aber auch an der Maschine."],
["37,14 €/h","Die Raumkosten (5.000 €) fehlen."],
["22,86 €/h","Nur die Abschreibung wurde verrechnet."]],
n:"Maschinenstundensatz = maschinenabhängige GK / Maschinenlaufstunden. Die Restgemeinkosten werden weiter über die Löhne verrechnet."},
{q:"Für welche Fertigungsart eignet sich die Äquivalenzziffernkalkulation?",
h:"Ordne jedem Kalkulationsverfahren die Produktionsstruktur zu: ein Produkt, ähnliche Produkte, verschiedene Produkte oder Kuppelprodukte.",
o:[["Sortenfertigung artverwandter Produkte, deren Kosten in einem festen Verhältnis stehen","Die Äquivalenzziffern bilden genau dieses feste Kostenverhältnis ab (z. B. Biersorten, Bleche verschiedener Stärke)."],
["Massenfertigung eines einzigen Produkts","Dafür reicht die einfache Divisionskalkulation."],
["Einzelfertigung sehr unterschiedlicher Produkte","Dafür ist die Zuschlagskalkulation geeignet."],
["Kuppelproduktion","Hier gibt es kein verursachungsgerechtes Verhältnis. Man nutzt die Restwert- oder die Verteilungsmethode."]],
n:"Division → Äquivalenzziffern → Zuschlag → Kuppelkalkulation: von homogen bis heterogen."},
{q:"Welches Verfahren der innerbetrieblichen Leistungsverrechnung erfasst gegenseitige Leistungsbeziehungen zwischen Hilfskostenstellen exakt?",
h:"Prüfe, ob das Verfahren Leistungsströme in beide Richtungen zwischen Vorkostenstellen abbilden kann.",
o:[["Gleichungsverfahren (simultanes Verfahren)","Das lineare Gleichungssystem berücksichtigt alle gegenseitigen Leistungsbeziehungen gleichzeitig."],
["Anbauverfahren","Es ignoriert Leistungen zwischen Hilfskostenstellen vollständig und verrechnet nur an Hauptkostenstellen."],
["Stufenleiterverfahren","Es verrechnet nur in eine Richtung, Rückflüsse an bereits abgerechnete Stellen fehlen."],
["Kostenartenverfahren","Es verrechnet nur ausgewählte Kostenarten und ist daher ungenau."]],
n:"Genauigkeit: Gleichungsverfahren > Stufenleiter > Anbauverfahren."},
{q:"Was sind in der Prozesskostenrechnung leistungsmengenneutrale (lmn) Prozesse?",
h:"Frag dich, ob die Kosten des Prozesses mit einem Kostentreiber (z. B. Anzahl der Bestellungen) schwanken.",
o:[["Prozesse, deren Kosten unabhängig vom Leistungsvolumen anfallen, z. B. „Abteilung leiten“","Sie haben keinen Kostentreiber und werden meist proportional auf die lmi-Prozesse umgelegt."],
["Prozesse, deren Kosten sich mit der Zahl der Kostentreiber ändern","Das sind leistungsmengeninduzierte (lmi) Prozesse."],
["Prozesse, die nur Einzelkosten verursachen","Die Prozesskostenrechnung verrechnet gerade Gemeinkosten."],
["Prozesse, die ausschließlich variable Kosten verursachen","lmn-Kosten sind typischerweise fix in Bezug auf die Prozessmenge."]],
n:"Prozesskostensatz (lmi) = Prozesskosten / Prozessmenge; Umlagesatz lmn = lmn-Kosten / lmi-Kosten."}
]},
{ title:"Entscheidungsrechnung & Plankosten", icon:"⚖️", qs:[
{q:"Fixkosten 240.000 €, Preis 80 €/Stück, variable Stückkosten 50 €. Wie hoch ist die Break-even-Menge?",
h:"Teile die Fixkosten durch den Stückdeckungsbeitrag (Preis minus variable Stückkosten). Achte auf die Einheit, gefragt ist eine Menge.",
o:[["8.000 Stück","240.000 / (80 − 50) = 8.000 Stück."],
["3.000 Stück","Hier wurde durch den Preis statt durch den Deckungsbeitrag geteilt."],
["4.800 Stück","Hier wurde durch die variablen Stückkosten statt durch den Deckungsbeitrag geteilt."],
["640.000","Das ist der Break-even-Umsatz in € (8.000 · 80 €), keine Menge."]],
n:"x_BE = K_f / (p − k_v); Umsatz_BE = K_f / DB-Quote."},
{q:"Freie Kapazität: Ein Kunde bietet 35 €/Stück für einen Zusatzauftrag. Variable Stückkosten 30 €, Vollkosten 42 €. Wie entscheidest du kurzfristig?",
h:"Welche Kosten ändern sich durch den Auftrag? Fixkosten fallen bei freier Kapazität ohnehin an.",
o:[["Annehmen: Der Deckungsbeitrag von 5 €/Stück verbessert das Ergebnis","Bei freier Kapazität sind nur die variablen Kosten entscheidungsrelevant. Qualitativ zu prüfen: Rückwirkungen auf die Preise für Stammkunden."],
["Ablehnen, weil der Preis unter den Vollkosten liegt","Die Fixkosten sind kurzfristig nicht abbaubar. Ablehnen würde auf 5 €/Stück Deckungsbeitrag verzichten."],
["Annehmen nur, wenn der Preis Vollkosten plus Gewinnzuschlag deckt","Das ist eine langfristige Vollkostensicht und für die kurzfristige Entscheidung irrelevant."],
["Gleichgültig, weil das Ergebnis unverändert bleibt","Das Ergebnis steigt um 5 € je Stück."]],
n:"Kurzfristige Preisuntergrenze bei freier Kapazität = variable Stückkosten."},
{q:"Engpass Maschinenzeit. A: DB 20 €, 4 min/Stück; B: DB 30 €, 10 min/Stück; C: DB 12 €, 2 min/Stück. Welche Produktionsreihenfolge ist optimal?",
h:"Rechne für jedes Produkt den relativen Deckungsbeitrag: Deckungsbeitrag geteilt durch die Engpassminuten.",
o:[["C → A → B","Relative DB: C = 6 €/min, A = 5 €/min, B = 3 €/min."],
["B → A → C","Das ist die Reihenfolge nach absolutem DB. Sie gilt nur ohne Engpass."],
["A → C → B","A hat mit 5 €/min einen niedrigeren relativen DB als C mit 6 €/min."],
["C → B → A","B hat mit 3 €/min den niedrigsten relativen DB und gehört ans Ende."]],
n:"Ein Engpass → relativer DB; mehrere Engpässe → lineare Optimierung."},
{q:"Make or Buy bei freier Kapazität: Eigenfertigung variable Kosten 18 €/Stück, zugeschlüsselte Fixkosten 7 €/Stück. Fremdbezugspreis 22 €. Entscheidung kurzfristig?",
h:"Vergleiche nur die Kosten, die durch die Entscheidung tatsächlich wegfallen oder entstehen.",
o:[["Eigenfertigung, weil 18 € < 22 €","Die Fixkosten fallen kurzfristig in beiden Fällen an und sind daher irrelevant."],
["Fremdbezug, weil 25 € Vollkosten > 22 €","Das stimmt nur, wenn die Fixkosten abbaubar sind (langfristige Betrachtung)."],
["Indifferent","Es gibt einen Kostenvorteil von 4 €/Stück für die Eigenfertigung."],
["Fremdbezug, weil Fixkosten immer zu berücksichtigen sind","Für kurzfristige Entscheidungen gilt: nur relevante Kosten zählen."]],
n:"Relevante Kosten = entscheidungsabhängige Kosten; Sunk Costs und nicht abbaubare Fixkosten bleiben außer Ansatz."},
{q:"Wie hoch ist die kurzfristige Preisuntergrenze, wenn ein Zusatzauftrag einen bestehenden Engpass beansprucht?",
h:"Wird ein Engpass belegt, musst du ein anderes Produkt verdrängen. Was kostet dich das?",
o:[["Variable Stückkosten + entgangener Deckungsbeitrag verdrängter Produkte (Opportunitätskosten)","Der Zusatzauftrag muss mindestens den verdrängten Deckungsbeitrag hereinholen."],
["Nur die variablen Stückkosten","Das gilt nur bei freier Kapazität."],
["Die vollen Selbstkosten","Das ist die langfristige Preisuntergrenze."],
["Die Fixkosten je Stück","Fixkosten sind kurzfristig nicht relevant."]],
n:"PUG (Engpass) = k_v + rel. DB des verdrängten Produkts × Engpassbeanspruchung."},
{q:"Flexible Plankostenrechnung auf Vollkostenbasis: Planbeschäftigung 1.000 h, Plankosten 50.000 € (davon fix 20.000 €). Istbeschäftigung 800 h, Istkosten 46.000 €. Wie hoch ist die Verbrauchsabweichung?",
h:"Ermittle zuerst die Sollkosten bei Istbeschäftigung: Fixkosten + variable Plankosten × (Ist-/Planbeschäftigung). Verbrauchsabweichung = Istkosten − Sollkosten.",
o:[["2.000 € (ungünstig)","Sollkosten = 20.000 + 30.000 · 0,8 = 44.000 €; 46.000 − 44.000 = 2.000 €."],
["4.000 €","Das ist die Beschäftigungsabweichung: Sollkosten 44.000 − verrechnete Plankosten 40.000 (50 €/h · 800 h)."],
["6.000 €","Das ist die Gesamtabweichung (Istkosten − verrechnete Plankosten)."],
["−4.000 €","Istkosten und Plankosten bei unterschiedlichen Beschäftigungen sind nicht vergleichbar."]],
n:"Gesamtabw. = Verbrauchsabw. (Ist − Soll) + Beschäftigungsabw. (Soll − verrechnete Plankosten)."}
]},
{ title:"Investitionsrechnung", icon:"💹", qs:[
{q:"Investition 10.000 € in t0, Rückflüsse je 6.000 € in t1 und t2, Kalkulationszins 10 %. Wie hoch ist der Kapitalwert?",
h:"Zinse jeden Rückfluss mit (1 + i)^t auf t0 ab und ziehe die Anschaffungsauszahlung ab.",
o:[["413,22 €","6.000/1,1 + 6.000/1,21 − 10.000 = 5.454,55 + 4.958,68 − 10.000 = 413,22 €."],
["2.000 €","Ohne Abzinsung. Damit wird der Zeitwert des Geldes ignoriert."],
["909,09 €","Der Rückfluss aus t2 wurde nur mit einer Periode abgezinst."],
["10.413,22 €","Das ist der Barwert der Rückflüsse. Die Anschaffungsauszahlung wurde nicht abgezogen."]],
n:"KW = −I₀ + Σ CFₜ · (1+i)^−t; KW > 0 → vorteilhaft."},
{q:"Kapitalwert 10.000 €, Laufzeit 5 Jahre, Zins 10 %. Wie hoch ist die Annuität?",
h:"Multipliziere den Kapitalwert mit dem Kapitalwiedergewinnungsfaktor i·q^n / (q^n − 1).",
o:[["2.637,97 €","KWF = 0,1 · 1,61051 / 0,61051 = 0,263797 → 2.637,97 €."],
["2.000,00 €","Einfache Division durch 5. Dabei fehlen die Zinsen."],
["1.000,00 €","KW · i ist die Annuität einer ewigen Rente, nicht bei 5 Jahren."],
["1.637,97 €","Das ist der Restwertverteilungsfaktor i/(q^n − 1). Er verteilt einen Endwert, keinen Barwert."]],
n:"Annuität = KW · KWF; KWF = Kehrwert des Rentenbarwertfaktors."},
{q:"Investition: −1.000 € in t0, +1.150 € in t1. Wie hoch ist der interne Zinsfuß?",
h:"Suche den Zins, bei dem der Kapitalwert null ist: −1.000 + 1.150/(1+r) = 0.",
o:[["15 %","1.150/1.000 − 1 = 0,15."],
["13,04 %","150 / 1.150. Bezugsbasis ist aber die Anschaffungsauszahlung."],
["1,15 %","Faktor und Prozentsatz verwechselt."],
["10 %","Ein typischer Kalkulationszins, aber kein Ergebnis aus der Zahlungsreihe."]],
n:"IZF: KW(r) = 0. Bei zwei Perioden einfach ablesbar, sonst Interpolation (Regula falsi)."},
{q:"Zwei sich gegenseitig ausschließende Investitionen: A hat den höheren Kapitalwert, B den höheren internen Zinsfuß. Wie entscheidest du (vollkommener Kapitalmarkt)?",
h:"Denk an die impliziten Wiederanlageprämissen der beiden Verfahren.",
o:[["Für A: Der Kapitalwert ist maßgeblich","Die Kapitalwertmethode unterstellt die Wiederanlage zum Kalkulationszins. Das ist auf dem vollkommenen Kapitalmarkt konsistent."],
["Für B: Eine höhere Rendite ist immer besser","Der IZF unterstellt die Wiederanlage zum IZF und ignoriert Volumen- und Laufzeitunterschiede."],
["Beide Verfahren führen stets zum gleichen Ergebnis","Bei Alternativenvergleichen gibt es typischerweise Rangfolgekonflikte."],
["Die kürzere Amortisationsdauer entscheidet","Ein statisches Risikomaß, kein Vorteilhaftigkeitskriterium."]],
n:"Konflikt KW vs. IZF → Kapitalwert (bzw. Differenzinvestition) entscheidet."},
{q:"Wie verhält sich die optimale Nutzungsdauer einer unendlichen identischen Investitionskette im Vergleich zur einmaligen Investition?",
h:"Bei einer Kette verschiebt jede Verlängerung der Nutzungsdauer auch die Kapitalwerte aller Folgeinvestitionen nach hinten.",
o:[["Sie ist kürzer (Ketteneffekt)","Längeres Nutzen schiebt die vorteilhaften Folgeobjekte hinaus. Deshalb lohnt der frühere Ersatz."],
["Sie ist länger","Genau umgekehrt: Der Zinseffekt auf die Folgeinvestitionen spricht für einen früheren Ersatz."],
["Sie ist immer gleich","Das gilt nur, wenn die Folgeinvestitionen einen Kapitalwert von null haben."],
["Sie entspricht der technischen Nutzungsdauer","Ökonomisch zählt der zeitliche Grenzgewinn, nicht die technische Lebensdauer."]],
n:"Einmalige Investition: nutzen, solange der zeitliche Grenzgewinn > 0. Kette: solange er > Annuität der Folgekette."},
{q:"Was ist ein zentraler Kritikpunkt an statischen Investitionsrechenverfahren?",
h:"Was unterscheidet statische von dynamischen Verfahren grundsätzlich?",
o:[["Der zeitliche Anfall der Zahlungen wird nicht berücksichtigt","Statische Verfahren rechnen mit Durchschnittswerten einer Periode, ohne Zinseszins."],
["Sie setzen einen vollkommenen Kapitalmarkt voraus","Diese Prämisse ist typisch für dynamische Verfahren (z. B. Kapitalwert)."],
["Sie sind aufwendiger als dynamische Verfahren","Sie sind gerade einfacher, deshalb werden sie in der Praxis genutzt."],
["Sie lassen sich nicht zum Alternativenvergleich verwenden","Kosten- und Gewinnvergleich sind gerade für Alternativenvergleiche gedacht."]],
n:"Statisch: Kosten-, Gewinn-, Rentabilitätsvergleich, Amortisation. Dynamisch: KW, Annuität, IZF, VOFI."}
]},
{ title:"Finanzierung", icon:"🏦", qs:[
{q:"Gesamtkapitalrendite 10 %, Fremdkapitalzins 6 %, Verschuldungsgrad FK/EK = 2. Wie hoch ist die Eigenkapitalrendite?",
h:"Leverage-Formel: r_EK = r_GK + (r_GK − r_FK) · FK/EK.",
o:[["18 %","10 % + (10 % − 6 %) · 2 = 18 %."],
["14 %","Hier wurde mit einem Verschuldungsgrad von 1 statt 2 gerechnet."],
["22 %","Mit dem FK-Zins statt mit der Zinsdifferenz multipliziert."],
["4 %","Das ist nur der Spread zwischen r_GK und r_FK."]],
n:"Leverage-Chance bei r_GK > r_FK, Leverage-Risiko bei r_GK < r_FK."},
{q:"EK-Quote 40 % (r_EK 12 %), FK-Quote 60 % (r_FK 5 %), Steuersatz 30 %. Wie hoch ist der WACC (nach Steuern)?",
h:"Gewichte die Kapitalkosten mit den Marktwertanteilen. Nur die FK-Zinsen werden um den Steuervorteil (1 − s) gekürzt.",
o:[["6,9 %","0,4 · 12 % + 0,6 · 5 % · 0,7 = 4,8 % + 2,1 % = 6,9 %."],
["7,8 %","Das Tax Shield auf die FK-Zinsen fehlt."],
["8,6 %","EK- und FK-Gewichte vertauscht."],
["5,46 %","Hier wurden auch die EK-Kosten um die Steuer gekürzt."]],
n:"WACC = EK/GK · r_EK + FK/GK · r_FK · (1 − s)."},
{q:"Modigliani/Miller mit Unternehmensteuern, dauerhaft konstantes Fremdkapital: Wie hoch ist der Wert des verschuldeten Unternehmens?",
h:"Fremdkapitalzinsen sind steuerlich abzugsfähig. Wie hoch ist der Barwert dieser Steuerersparnis bei ewigem FK?",
o:[["V_L = V_U + s · FK","Barwert des Tax Shields = s · r_FK · FK / r_FK = s · FK."],
["V_L = V_U","Das ist These I ohne Steuern."],
["V_L = V_U − s · FK","Das Vorzeichen ist falsch, der Steuervorteil erhöht den Wert."],
["V_L = V_U · (1 − s)","Das ist keine Formel aus dem MM-Modell."]],
n:"Mit Steuern wäre nach MM 100 % FK optimal. Begrenzt wird das in der Realität durch Insolvenz- und Agency-Kosten (Trade-off-Theorie)."},
{q:"Kapitalerhöhung: Börsenkurs alt 60 €, Emissionskurs 40 €, Bezugsverhältnis 4 : 1. Wie hoch ist der rechnerische Wert des Bezugsrechts?",
h:"B = (K_alt − K_neu) / (Bezugsverhältnis + 1). Alternativ: Mischkurs bilden und von K_alt abziehen.",
o:[["4 €","(60 − 40) / (4 + 1) = 4 €; Mischkurs 56 €."],
["5 €","Hier fehlt das „+ 1“ im Nenner."],
["20 €","Das ist die Kursdifferenz, verteilt wird sie aber auf alte und neue Aktien."],
["56 €","Das ist der Mischkurs nach der Kapitalerhöhung, nicht das Bezugsrecht."]],
n:"Mischkurs = (a · K_alt + n · K_neu)/(a + n); B = K_alt − Mischkurs."},
{q:"Was kennzeichnet echtes Factoring?",
h:"Unterscheide zwei Fragen: Wer trägt das Ausfallrisiko (echt/unecht), und wird der Schuldner informiert (offen/still)?",
o:[["Der Factor übernimmt das Delkredererisiko (Ausfallrisiko)","Das ist das Merkmal des echten Factorings. Die Forderung geht beim Verkäufer bilanziell ab."],
["Das Ausfallrisiko bleibt beim Verkäufer","Das ist unechtes Factoring."],
["Der Schuldner wird über die Abtretung nicht informiert","Das beschreibt stilles Factoring, unabhängig von echt oder unecht."],
["Factoring ist eine Form der Beteiligungsfinanzierung","Es ist eine Finanzierung durch Vermögensumschichtung (Forderungsverkauf), keine EK-Zuführung."]],
n:"Factoring-Funktionen: Finanzierung, Delkredere, Dienstleistung (Debitorenmanagement)."},
{q:"Wie ist der Anlagendeckungsgrad II definiert?",
h:"Die goldene Bilanzregel verlangt die fristenkongruente Finanzierung des Anlagevermögens. Welche Kapitalarten sind langfristig?",
o:[["(Eigenkapital + langfristiges Fremdkapital) / Anlagevermögen","Er sollte ≥ 100 % sein (goldene Bilanzregel im weiteren Sinne)."],
["Eigenkapital / Anlagevermögen","Das ist der Anlagendeckungsgrad I."],
["Umlaufvermögen / kurzfristige Verbindlichkeiten","Das ist die Liquidität 3. Grades (Current Ratio)."],
["(EK + langfristiges FK) / (AV + langfristig gebundenes UV)","Das ist der Anlagendeckungsgrad III."]],
n:"Horizontale Bilanzkennzahlen: Deckungsgrade; vertikale: EK-Quote, Anlagenintensität."}
]},
{ title:"Controlling & Unternehmensführung", icon:"🧭", qs:[
{q:"Gewinn 60, Umsatz 1.200, Gesamtkapital 600. Wie hoch ist der ROI nach DuPont?",
h:"ROI = Umsatzrendite (Gewinn/Umsatz) × Kapitalumschlag (Umsatz/Kapital).",
o:[["10 %","5 % × 2 = 10 % (= 60/600)."],
["5 %","Das ist nur die Umsatzrendite."],
["2,5 %","Hier wurde durch den Kapitalumschlag geteilt statt mit ihm multipliziert."],
["200 %","Der Kapitalumschlag (2) wurde als Prozentwert gelesen."]],
n:"DuPont: Zerlegung des ROI in Rentabilitäts- und Umschlagskomponente."},
{q:"NOPAT 12 Mio. €, investiertes Kapital 100 Mio. €, WACC 8 %. Wie hoch ist der EVA?",
h:"EVA = operativer Gewinn nach Steuern − Kapitalkosten auf das investierte Kapital.",
o:[["4 Mio. €","12 − 8 % · 100 = 4 Mio. €. Das Unternehmen verdient mehr als seine Kapitalkosten."],
["12 Mio. €","Das ist der NOPAT. Die Kapitalkosten wurden nicht abgezogen."],
["8 Mio. €","Das sind nur die Kapitalkosten."],
["20 Mio. €","Die Kapitalkosten wurden addiert statt abgezogen."]],
n:"EVA = NOPAT − WACC · Capital = (ROIC − WACC) · Capital. Barwert der EVAs = MVA."},
{q:"DIO (Lagerdauer) 40 Tage, DSO (Debitorenlaufzeit) 50 Tage, DPO (Kreditorenlaufzeit) 30 Tage. Wie lang ist der Cash Conversion Cycle?",
h:"Wie lange ist Geld gebunden? Lager- und Forderungsdauer verlängern die Bindung, Lieferantenziele verkürzen sie.",
o:[["60 Tage","40 + 50 − 30 = 60 Tage."],
["120 Tage","Die DPO wurde addiert statt abgezogen."],
["20 Tage","Die Lagerdauer fehlt."],
["40 Tage","Das ist nur die Lagerdauer."]],
n:"CCC = DIO + DSO − DPO. Kürzerer CCC → geringerer Working-Capital-Bedarf."},
{q:"Ein Manager (Agent) handelt nach Vertragsschluss für den Eigentümer unbeobachtbar im Eigeninteresse. Welches Agency-Problem liegt vor?",
h:"Ordne zeitlich ein: vor oder nach Vertragsschluss? Geht es um Eigenschaften, Handlungen oder Absichten?",
o:[["Moral Hazard (Hidden Action)","Die Handlung ist nach Vertragsschluss nicht beobachtbar. Lösung: Anreizsysteme, Monitoring."],
["Adverse Selection (Hidden Characteristics)","Das betrifft verborgene Eigenschaften vor Vertragsschluss. Lösung: Signaling, Screening."],
["Hold-up (Hidden Intention)","Hier wird die Abhängigkeit nach spezifischen Investitionen ausgenutzt."],
["Trittbrettfahrerproblem","Ein Problem bei öffentlichen Gütern, kein Principal-Agent-Problem."]],
n:"Agency-Kosten = Überwachungs- + Bindungskosten + Residualverlust (Jensen/Meckling)."},
{q:"BCG-Matrix: Ein Produkt hat hohes Marktwachstum, aber einen geringen relativen Marktanteil. Welche Normstrategie gilt?",
h:"Erst Feld bestimmen (Star, Cash Cow, Question Mark, Poor Dog), dann die Normstrategie zuordnen.",
o:[["Selektiv: offensiv investieren oder zurückziehen","Ein Question Mark verbraucht viel Liquidität. Entweder zum Star ausbauen oder aufgeben."],
["Abschöpfen","Das ist die Strategie für Cash Cows (hoher Anteil, geringes Wachstum)."],
["Immer desinvestieren","Das ist die Normstrategie für Poor Dogs."],
["Marktanteil halten und weiter investieren","Das ist die Strategie für Stars (hoher Anteil, hohes Wachstum)."]],
n:"Cash Cows finanzieren Question Marks und Stars (Portfoliogleichgewicht)."},
{q:"Wie sind die Perspektiven der Balanced Scorecard miteinander verknüpft?",
h:"Kaplan/Norton wollten Strategie in messbare Ziele übersetzen. Wie wirken Lernen, Prozesse, Kunden und Finanzen aufeinander?",
o:[["Über Ursache-Wirkungs-Ketten, die letztlich auf die Finanzperspektive zielen","Lernen und Entwicklung → Prozesse → Kunden → Finanzen."],
["Gar nicht, sie stehen unabhängig nebeneinander","Gerade die Verknüpfung (Strategy Map) ist Kern der BSC."],
["Nur über Budgets","Die BSC ergänzt die Finanzsteuerung um nicht-finanzielle Kennzahlen."],
["Hierarchisch, mit der Kundenperspektive an der Spitze","Bei erwerbswirtschaftlichen Unternehmen steht die Finanzperspektive am Ende der Kette."]],
n:"BSC: Ziele, Kennzahlen, Vorgaben, Maßnahmen je Perspektive; Früh- und Spätindikatoren."}
]},
{ title:"Mikroökonomie", icon:"🛒", qs:[
{q:"Der Preis steigt um 5 %, die nachgefragte Menge sinkt um 10 %. Wie reagiert die Nachfrage und was passiert mit dem Umsatz?",
h:"Preiselastizität = %-Mengenänderung / %-Preisänderung. Ist der Betrag größer als 1, überwiegt der Mengeneffekt.",
o:[["Elastisch (|ε| = 2), der Umsatz sinkt","1,05 · 0,90 = 0,945, also etwa 5,5 % weniger Umsatz."],
["Unelastisch, der Umsatz steigt","Das gilt nur für |ε| < 1."],
["Einheitselastisch, der Umsatz bleibt konstant","Das gilt nur für |ε| = 1."],
["Vollkommen elastisch","Dann bräche die Nachfrage bei jeder Preiserhöhung vollständig ein."]],
n:"|ε| > 1: Preissenkung erhöht den Umsatz; |ε| < 1: Preiserhöhung erhöht den Umsatz."},
{q:"Monopol: Nachfrage p = 100 − x, konstante Grenzkosten 20. Welche Menge und welcher Preis maximieren den Gewinn?",
h:"Grenzerlös bilden (bei linearer Nachfrage doppelte Steigung): GE = 100 − 2x. Mit den Grenzkosten gleichsetzen, dann den Preis an der Nachfragekurve ablesen.",
o:[["x = 40, p = 60","100 − 2x = 20 → x = 40; p = 100 − 40 = 60 (Cournot-Punkt)."],
["x = 80, p = 20","Das ist die Lösung bei vollständiger Konkurrenz (Preis = Grenzkosten)."],
["x = 50, p = 50","Das ist das Umsatzmaximum (GE = 0), nicht das Gewinnmaximum."],
["x = 40, p = 20","Die Menge stimmt, aber der Preis wird an der Nachfragekurve abgelesen, nicht an den Grenzkosten."]],
n:"Monopol: GE = GK; Wohlfahrtsverlust (Harberger-Dreieck) ggü. Konkurrenz."},
{q:"Was gilt im langfristigen Gleichgewicht bei vollständiger Konkurrenz?",
h:"Gewinne locken neue Anbieter an, bis kein Anreiz zum Marktzutritt mehr besteht.",
o:[["Preis = Grenzkosten = Minimum der Durchschnittskosten; ökonomischer Gewinn null","Durch freien Marktzutritt werden die Gewinne wegkonkurriert (Betriebsoptimum)."],
["Preis über den Durchschnittskosten, positiver Gewinn","Das ist kurzfristig möglich, langfristig nicht stabil."],
["Preis = Minimum der durchschnittlichen variablen Kosten","Das ist das Betriebsminimum, also die kurzfristige Preisuntergrenze."],
["Grenzerlös über den Grenzkosten","Bei Preisnehmern gilt GE = p = GK."]],
n:"Betriebsminimum (min. AVC) = kurzfristige PUG; Betriebsoptimum (min. AC) = langfristige PUG."},
{q:"Die Kreuzpreiselastizität zwischen Gut A und Gut B ist positiv. Was folgt daraus?",
h:"Steigt der Preis von B: Wird A dann mehr oder weniger nachgefragt?",
o:[["A und B sind Substitute","Steigt der Preis von B, weichen Konsumenten auf A aus (z. B. Butter und Margarine)."],
["A und B sind Komplemente","Bei Komplementen ist die Kreuzpreiselastizität negativ (z. B. Drucker und Patronen)."],
["A und B sind unabhängig","Dann ist sie null."],
["A ist ein inferiores Gut","Das bestimmt die Einkommenselastizität (< 0), nicht die Kreuzpreiselastizität."]],
n:"Kreuzpreiselastizität > 0 → Substitute, < 0 → Komplemente."},
{q:"Ein Unternehmen verursacht negative externe Effekte (Umweltschäden). Was gilt ohne staatlichen Eingriff, und was ist die klassische Lösung?",
h:"Vergleiche private und soziale Grenzkosten. Wer trägt den Schaden nicht?",
o:[["Die Produktion ist zu hoch; eine Pigou-Steuer in Höhe des Grenzschadens im Optimum internalisiert den Effekt","Die privaten Grenzkosten liegen unter den sozialen. Die Steuer bringt beide in Übereinstimmung."],
["Die Produktion ist zu niedrig; eine Subvention ist nötig","Das gilt für positive externe Effekte."],
["Der Markt erreicht stets das Optimum","Externe Effekte sind ein klassisches Marktversagen."],
["Nach Coase lassen sich Externalitäten nur bei hohen Transaktionskosten privat lösen","Umgekehrt: Coase setzt geringe Transaktionskosten und klare Eigentumsrechte voraus."]],
n:"Instrumente: Pigou-Steuer, Zertifikate (Emissionshandel), Auflagen, Verhandlungen (Coase)."},
{q:"Gefangenendilemma: Was gilt für das Nash-Gleichgewicht?",
h:"Prüfe für jeden Spieler die beste Antwort auf jede Strategie des anderen. Gibt es eine dominante Strategie?",
o:[["Beide gestehen bzw. defektieren; das Ergebnis ist nicht pareto-effizient","Defektieren ist dominant. Beide stünden mit Kooperation besser."],
["Beide kooperieren, weil das gemeinsam besser ist","Kooperation ist kein Gleichgewicht, jeder hat einen Anreiz abzuweichen."],
["Es gibt kein Nash-Gleichgewicht","Es gibt genau eines in dominanten Strategien."],
["Das Nash-Gleichgewicht ist immer pareto-optimal","Gerade das Gefangenendilemma zeigt das Gegenteil."]],
n:"Wiederholte Spiele (Tit for Tat) können Kooperation stabilisieren → Kartellstabilität."}
]},
{ title:"Makroökonomie & Finanzwissenschaft", icon:"🏛️", qs:[
{q:"Marginale Konsumquote 0,75. Der Staat erhöht kreditfinanziert die Ausgaben um 10 Mrd. €. Um wie viel steigt das Einkommen (einfaches Keynes-Modell)?",
h:"Multiplikator = 1 / (1 − c). Dann mit der Ausgabenänderung multiplizieren.",
o:[["40 Mrd. €","1/(1 − 0,75) = 4 → 4 · 10 = 40 Mrd. €."],
["13,33 Mrd. €","Hier wurde durch c statt durch (1 − c) geteilt."],
["7,5 Mrd. €","Nur die erste Konsumrunde."],
["10 Mrd. €","Ein Multiplikator von 1 gilt beim steuerfinanzierten Budget (Haavelmo)."]],
n:"Staatsausgabenmultiplikator 1/(1 − c); Steuermultiplikator −c/(1 − c)."},
{q:"Der Staat erhöht die Ausgaben um 10 Mrd. € und finanziert dies vollständig durch Pauschalsteuern. Wie verändert sich das Einkommen?",
h:"Addiere Ausgaben- und Steuermultiplikator: 1/(1 − c) − c/(1 − c).",
o:[["Es steigt um 10 Mrd. € (Haavelmo-Theorem, Multiplikator 1)","(1 − c)/(1 − c) = 1."],
["Es bleibt unverändert","Die Steuer wirkt nur über den Konsum (c < 1) und dämpft deshalb schwächer."],
["Es steigt um 40 Mrd. €","Das gilt nur bei Kreditfinanzierung."],
["Es sinkt","Der Ausgabeneffekt überwiegt den Steuereffekt."]],
n:"Haavelmo: Multiplikator des ausgeglichenen Budgets = 1."},
{q:"Quantitätstheorie: Die Geldmenge wächst um 5 %, das reale BIP um 2 %, die Umlaufgeschwindigkeit ist konstant. Wie hoch ist die Inflation ungefähr?",
h:"M · V = P · Y in Wachstumsraten: m + v = π + y.",
o:[["3 %","5 % + 0 % − 2 % ≈ 3 %."],
["7 %","Hier wurde das reale Wachstum addiert statt abgezogen."],
["5 %","Das reale Wachstum fehlt."],
["2 %","Das ist das reale Wachstum, nicht die Inflation."]],
n:"Monetaristische Regel: Geldmenge ≈ Potenzialwachstum + Zielinflation."},
{q:"Warum ist expansive Geldpolitik in der Liquiditätsfalle (IS-LM) wirkungslos?",
h:"Wie reagiert der Zins auf eine Geldmengenerhöhung, wenn die LM-Kurve waagerecht verläuft?",
o:[["Die zusätzliche Geldmenge wird vollständig gehortet, der Zins sinkt nicht weiter","Die Spekulationskasse ist unendlich zinselastisch, deshalb gibt es keinen Investitionsimpuls."],
["Weil die Investitionen vollkommen zinselastisch sind","Dann wäre die Geldpolitik besonders wirksam (Investitionsfalle ist das Gegenteil)."],
["Weil die Fiskalpolitik dort Crowding-out auslöst","In der Liquiditätsfalle gibt es gerade kein zinsinduziertes Crowding-out."],
["Weil die Preise vollkommen flexibel sind","Das ist ein klassisches Argument, nicht die Begründung der Liquiditätsfalle."]],
n:"Liquiditätsfalle: Fiskalpolitik voll wirksam; Geldpolitik wirkungslos."},
{q:"Das Angebot eines Gutes ist sehr unelastisch, die Nachfrage elastisch. Wer trägt die Last einer Mengensteuer überwiegend?",
h:"Die ökonomische Inzidenz hängt nicht davon ab, wer die Steuer abführt. Wer kann schlechter ausweichen?",
o:[["Die Anbieter","Die unelastischere Marktseite kann nicht ausweichen und trägt die größere Last."],
["Die Nachfrager","Sie können ausweichen, weil ihre Nachfrage elastisch ist."],
["Immer derjenige, der die Steuer an das Finanzamt abführt","Die formale Inzidenz ist für die Lastverteilung irrelevant."],
["Beide immer je zur Hälfte","Das gilt nur bei betragsmäßig gleichen Elastizitäten."]],
n:"Zusatzlast (Excess Burden) steigt etwa mit dem Quadrat des Steuersatzes."},
{q:"Was gilt bei einem direkt progressiven Einkommensteuertarif?",
h:"Der Grenzsteuersatz gilt für den letzten Euro, der Durchschnittssteuersatz für das gesamte Einkommen. Was passiert mit dem Durchschnitt, wenn der Grenzwert darüber liegt?",
o:[["Der Grenzsteuersatz liegt über dem Durchschnittssteuersatz; beide steigen mit dem Einkommen","Jeder zusätzliche Euro wird höher belastet und zieht den Durchschnitt nach oben."],
["Der Durchschnittssteuersatz liegt über dem Grenzsteuersatz","Das wäre ein regressiver Verlauf."],
["Beide sind gleich hoch","Das gilt nur bei einem proportionalen Tarif ohne Freibetrag."],
["Der Grenzsteuersatz sinkt mit steigendem Einkommen","Das widerspricht der Progression."]],
n:"Leistungsfähigkeitsprinzip: horizontal = gleiche Leistungsfähigkeit, gleiche Steuer; vertikal = höhere Leistungsfähigkeit, höhere Steuer."}
]}
]},
{ title:"Steuerrecht", short:"Steuerrecht", color:"#1cb0f6", icon:"💶", lessons:[
{ title:"Abgabenordnung & FGO", icon:"📨", qs:[
{q:"Ein Steuerbescheid wird am Montag, 2.11.2026, zur Post gegeben. Wann endet die Einspruchsfrist?",
h:"1) Bekanntgabefiktion nach § 122 Abs. 2 Nr. 1 AO (seit 2025: 4 Tage). 2) Einen Monat addieren. 3) Fällt das Ende auf ein Wochenende oder einen Feiertag, gilt § 108 Abs. 3 AO.",
o:[["Montag, 7.12.2026","Bekanntgabe Fr 6.11.; Fristende So 6.12. → nächster Werktag Mo 7.12. (§ 108 Abs. 3 AO)."],
["Sonntag, 6.12.2026","Das Wochenende wurde nicht berücksichtigt."],
["Mittwoch, 2.12.2026","Die Bekanntgabefiktion fehlt, gerechnet wurde ab Aufgabe zur Post."],
["Freitag, 4.12.2026","Ein Monat ist nicht gleich vier Wochen (§ 108 Abs. 1 AO i.V.m. § 188 Abs. 2 BGB)."]],
n:"§ 355 Abs. 1 AO: Einspruchsfrist 1 Monat ab Bekanntgabe; Viertagesfiktion seit 1.1.2025."},
{q:"ESt 2021: Die Erklärung (Pflichtveranlagung) wurde am 15.6.2023 eingereicht. Wann endet die reguläre Festsetzungsfrist?",
h:"Regelfrist 4 Jahre (§ 169 AO). Beginn mit Ablauf des Jahres der Entstehung, aber Anlaufhemmung bei Erklärungspflicht (§ 170 Abs. 2 Nr. 1 AO): Beginn mit Ablauf des Jahres der Einreichung, max. 3 Jahre.",
o:[["31.12.2027","Fristbeginn mit Ablauf 2023 (Einreichungsjahr) + 4 Jahre."],
["31.12.2025","Ohne Anlaufhemmung gerechnet. Bei Erklärungspflicht greift § 170 Abs. 2 AO."],
["15.6.2027","Die Frist läuft nicht tagesgenau ab Einreichung, sondern zum Jahresende."],
["31.12.2028","Die maximale Anlaufhemmung (Ablauf 2024) gilt nur, wenn keine Erklärung eingereicht wird."]],
n:"Festsetzungsfrist: 4 J (regulär), 5 J (leichtfertige Verkürzung), 10 J (Hinterziehung)."},
{q:"Nach Eintritt der Bestandskraft erfährt das Finanzamt von bisher unbekannten Mieteinnahmen. Ist eine Änderung zuungunsten des Steuerpflichtigen möglich?",
h:"Prüfe § 173 Abs. 1 AO: Unterscheide Nr. 1 (höhere Steuer) und Nr. 2 (niedrigere Steuer). Wo spielt das Verschulden eine Rolle?",
o:[["Ja, nach § 173 Abs. 1 Nr. 1 AO – unabhängig vom Verschulden des Steuerpflichtigen","Neue Tatsachen, die zu einer höheren Steuer führen, erlauben eine Änderung (Grenzen: Treu und Glauben bei Ermittlungsfehlern des FA, Änderungssperre nach Außenprüfung)."],
["Nur, wenn den Steuerpflichtigen kein grobes Verschulden trifft","Das ist die Voraussetzung für Änderungen zugunsten des Steuerpflichtigen (Nr. 2)."],
["Nein, bestandskräftige Bescheide sind unabänderlich","Bestandskraft schließt nur den Einspruch aus. Die Korrekturvorschriften gelten weiter."],
["Nur bei einem Vorbehalt der Nachprüfung","§ 164 AO ist eine eigene, zusätzliche Änderungsnorm."]],
n:"Bei jeder Korrektur zusätzlich prüfen: Festsetzungsfrist noch offen?"},
{q:"ESt-Nachzahlung 10.080 €, fällig am 10.3.2026, Zahlung per Überweisung am 20.4.2026. Wie hoch sind die Säumniszuschläge?",
h:"§ 240 AO: 1 % für jeden angefangenen Monat; die Steuer wird auf den nächsten durch 50 € teilbaren Betrag abgerundet. Zähle die angefangenen Monate ab Fälligkeit.",
o:[["201,00 €","Abgerundet 10.050 € × 1 % = 100,50 € × 2 angefangene Monate."],
["201,60 €","Die Abrundung auf volle 50 € fehlt."],
["100,50 €","Ab 11.4. hat bereits der zweite Säumnismonat begonnen."],
["0 €","Die Schonfrist von 3 Tagen (§ 240 Abs. 3 AO) ist längst abgelaufen."]],
n:"Säumniszuschlag ≠ Verspätungszuschlag (§ 152 AO, Erklärung) ≠ Zinsen (§ 233a AO)."},
{q:"Mit welchem Zinssatz werden Steuernachforderungen nach § 233a AO verzinst?",
h:"Denk an den BVerfG-Beschluss von 2021 und die Neuregelung von 2022 für Zeiträume ab 2019.",
o:[["0,15 % pro vollem Monat (1,8 % p.a.)","§ 238 Abs. 1a AO, rückwirkend für Verzinsungszeiträume ab 1.1.2019. Der Zinslauf beginnt 15 Monate nach Ablauf des Entstehungsjahres."],
["0,5 % pro Monat","Der alte Satz ist für Zeiträume ab 2019 verfassungswidrig."],
["1 % pro angefangenem Monat","Das ist der Säumniszuschlag nach § 240 AO."],

/* ======================= APP-LOGIK ======================= /
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$("#app");
const KEY="wplingo-v2", HMAX=5, HREG=30601000, GOAL=30, IV=[0,1,2,4,8,16,32], DAY=864e5;
let tab=0, L=null;
const today=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString("sv")};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()a.length)];
const fmt=n=>n.toLocaleString("de-DE");
const hash=s=>{let h=0;for(const ch of s)h=(h31+ch.charCodeAt(0))|0;return(h>>>0).toString(36)};
C.forEach((c,ci)=>c.lessons.forEach((l,li)=>l.qs.forEach(q=>{q.id=hash(q.q);q.ci=ci;q.li=li})));
const ALL=C.flatMap(c=>c.lessons.flatMap(l=>l.qs));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
const S=Object.assign({xp:0,streak:0,lastDay:null,hearts:HMAX,heartTs:Date.now(),cards:{},done:{},dayXp:0,xpDay:today(),unlockAll:false},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function regen(){if(S.hearts>=HMAX){S.heartTs=Date.now();return}const n=Math.floor((Date.now()-S.heartTs)/HREG);if(n>0){S.hearts=Math.min(HMAX,S.hearts+n);S.heartTs+=nHREG}if(S.hearts>=HMAX)S.heartTs=Date.now();save()}
function dayCheck(){if(S.xpDay!==today()){S.xpDay=today();S.dayXp=0}}
const streakNow=()=>(S.lastDay===today()||S.lastDay===today(-1))?S.streak:0;
const box=q=>(S.cards[q.id]||{}).box||0;
const pct=qs=>Math.round(qs.reduce((s,q)=>s+box(q),0)/(qs.length(IV.length-1))100);
const dueList=()=>ALL.filter(q=>S.cards[q.id]&&S.cards[q.id].due<=Date.now());
function grade(q,ok,hint){const b=ok?(hint?Math.max(box(q),1):Math.min(box(q)+1,IV.length-1)):0;S.cards[q.id]={box:b,due:Date.now()+IV[b]DAY}}
function addXp(x){dayCheck();S.xp+=x;S.dayXp+=x;if(S.lastDay!==today()){S.streak=S.lastDay===today(-1)?S.streak+1:1;S.lastDay=today()}}
function hud(){regen();dayCheck();return`<div class="hud"><span>🔥 ${streakNow()}</span><span>💎 ${fmt(S.xp)} XP</span><span>❤️ ${S.hearts}</span></div>`}
function nav(a){const d=dueList().length;return`<nav class="nav"><button class="${a==="learn"?"on":""}" onclick="home()">🏠<small>Lernen</small></button><button class="${a==="review"?"on":""}" onclick="review()">🔁<small>Wiederholen${d?`<span class="badge">${d}</span>`:""}</small></button><button class="${a==="stats"?"on":""}" onclick="stats()">📊<small>Statistik</small></button></nav>`}
function home(){
L=null;const c=C[tab],offs=[0,60,85,60,0,-60,-85,-60];
app.innerHTML=hud()+`<div class="tabs">${C.map((x,i)=>`<button class="tab ${i===tab?"on":""}" style="--c:${x.color}" onclick="tab=${i};home()">${x.icon} ${x.short}</button>`).join("")}</div>
<div class="banner" style="--c:${c.color}"><h2>${c.title}</h2><div>${pct(c.lessons.flatMap(l=>l.qs))} % gemeistert · ${c.lessons.reduce((s,l)=>s+l.qs.length,0)} Fragen</div>
<div class="row"><span>🎯 ${Math.min(S.dayXp,GOAL)}/${GOAL} XP</span><div class="bar"><div style="width:${Math.min(100,S.dayXp/GOAL100)}%"></div></div><button class="btn white" onclick="mix(${tab})">🎲 Mix</button></div></div>
<div class="path">${c.lessons.map((l,li)=>{const n=S.done[tab+"-"+li]||0,open=S.unlockAll||li===0||!!S.done[tab+"-"+(li-1)];
return`<div class="node ${open?"":"locked"}" style="--c:${c.color};transform:translateX(${offs[li%8]}px)" onclick="tryStart(${tab},${li},${open})"><div class="circle">${open?(n?"⭐":l.icon):"🔒"}</div><div class="lbl">${l.title}<small>${n?n+"× geschafft · ":""}${pct(l.qs)} % · ${l.qs.length} Fragen</small></div></div>`}).join("")}</div>`+nav("learn");
window.scrollTo(0,0);
}
function tryStart(ci,li,open){if(!open&&!confirm("Diese Lektion ist noch gesperrt. Trotzdem starten?"))return;start(ci,li)}
function start(ci,li){const qs=shuffle([...C[ci].lessons[li].qs]).sort((a,b)=>box(a)-box(b)).slice(0,8);begin(shuffle(qs),"lesson",ci,li)}
function mix(ci){begin(shuffle(C[ci].lessons.flatMap(l=>[...l.qs])).slice(0,10),"mix",ci,null)}
function review(){
let qs=dueList().sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
if(!qs.length)qs=ALL.filter(q=>S.cards[q.id]).sort((a,b)=>box(a)-box(b));
if(!qs.length){L=null;app.innerHTML=hud()+`<div class="end"><div class="big">📚</div><h2>Noch nichts zu wiederholen</h2><p>Starte zuerst ein paar Lektionen. Fällige und falsch beantwortete Fragen landen dann automatisch hier.</p><div class="col"><button class="btn" onclick="home()">Zu den Lektionen</button></div></div>`+nav("review");return}
begin(shuffle(qs.slice(0,10)),"review",null,null);
}
function begin(qs,mode,ci,li){if(mode!=="review"){regen();if(S.hearts<=0)return noHearts()}L={mode,ci,li,queue:qs,total:qs.length,done:0,mistakes:0,firstWrong:0,hinted:0,seen:new Set()};renderQ()}
function noHearts(){const m=Math.max(1,Math.ceil((HREG-(Date.now()-S.heartTs))/60000));L=null;
app.innerHTML=hud()+`<div class="end"><div class="big">💔</div><h2>Keine Herzen mehr</h2><p>Nächstes Herz in ca. ${m} Min.</p><p>Tipp: Beim Wiederholen verlierst du keine Herzen und bekommst pro Runde eins zurück.</p><div class="col"><button class="btn" onclick="review()">🔁 Jetzt wiederholen</button><button class="btn sec" onclick="home()">Zurück</button></div></div>`+nav("learn")}
function renderQ(){
const q=L.queue[0];L.sel=null;L.checked=false;L.hint=false;
const c=C[q.ci],ord=shuffle(q.o.map((_,i)=>i));
app.innerHTML=`<div class="top"><button class="x" onclick="quit()">✕</button><div class="bar"><div style="width:${L.done/L.total100}%"></div></div><span class="hh">${L.mode==="review"?"🔁":"❤️ "+S.hearts}</span></div>
<div class="card"><div class="tag" style="color:${c.color}">${c.icon} ${c.lessons[q.li].title}</div><h2 class="q">${q.q}</h2>
<button id="hb" class="hintbtn" onclick="showHint()">💡 Tipp zur Herangehensweise</button><div id="hint" class="hint" hidden>💡 <b>Herangehensweise:</b> ${q.h}</div>
<div class="opts">${ord.map((i,k)=>`<div class="opt" data-v="${i}"><span class="key">${"ABCDE"[k]}</span><div><div>${q.o[i][0]}</div><div class="why" hidden></div></div></div>`).join("")}</div></div>
<div id="foot" class="foot"><div class="fi"><span class="kbd">Tasten: 1–4 wählen · H Tipp · Enter prüfen</span><button id="chk" class="btn" disabled onclick="check()">Prüfen</button></div></div>`;
$$(".opt").forEach(b=>b.onclick=()=>pickOpt(b));
window.scrollTo(0,0);
}
function pickOpt(b){if(!L||L.checked)return;$$(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");L.sel=+b.dataset.v;$("#chk").disabled=false}
function showHint(){const h=$("#hint");if(!L||!h)return;h.hidden=false;$("#hb").hidden=true;if(!L.checked)L.hint=true}
function check(){
if(!L||L.checked||L.sel===null)return;
const q=L.queue[0];L.checked=true;const ok=L.sel===0;
$$(".opt").forEach(b=>{const v=+b.dataset.v,w=b.querySelector(".why");
b.classList.remove("sel");b.classList.add(v===0?"right":v===L.sel?"wrongsel":"dim");
w.innerHTML=`<b>${v===0?"✅ Stimmt:":"❌ Passt nicht:"}</b> ${q.o[v][1]}`;w.hidden=false});
if(!L.seen.has(q.id)){L.seen.add(q.id);grade(q,ok,L.hint);if(!ok)L.firstWrong++;else if(L.hint)L.hinted++}
if(ok){L.done++;L.queue.shift()}
else{L.mistakes++;if(L.mode!=="review"){if(S.hearts>=HMAX)S.heartTs=Date.now();S.hearts=Math.max(0,S.hearts-1)}L.queue.push(L.queue.shift())}
save();
const f=$("#foot");f.className="foot "+(ok?"ok":"bad");
f.innerHTML=`<div class="fi"><div class="msg"><h3>${ok?pick(["Richtig! ✅","Super! 🎉","Klasse! 💪","Genau! 🎯"]):"Leider falsch ❌ – die Frage kommt nochmal"}</h3>${q.n?`<p>📌 <b>Merke:</b> ${q.n}</p>`:""}<p style="color:#777">Begründungen zu allen Antworten stehen oben bei den Optionen.</p></div><button class="btn" onclick="next()">Weiter</button></div>`;
$(".top .bar>div").style.width=(L.done/L.total100)+"%";
const hh=$(".hh");if(hh&&L.mode!=="review")hh.textContent="❤️ "+S.hearts;
$(".opts").scrollIntoView({behavior:"smooth",block:"start"});
}
function next(){if(L.mode!=="review"&&S.hearts<=0)return end(false);if(!L.queue.length)return end(true);renderQ()}
function quit(){if(confirm("Lektion wirklich abbrechen?"))home()}
function end(win){
const m=L.mode;let xp=0,heart=false;
const firstOk=L.total-L.firstWrong;
if(win){xp=(m==="review"?5:10)+(firstOk-L.hinted)2+L.hinted+(L.firstWrong||L.hinted?0:5);addXp(xp);
if(m==="lesson"){const k=L.ci+"-"+L.li;S.done[k]=(S.done[k]||0)+1}
if(m==="review"&&S.hearts<HMAX){S.hearts++;heart=true}save()}
const acc=Math.round(firstOk/L.total100);
app.innerHTML=`<div class="end"><div class="big">${win?(acc===100&&!L.hinted?"🏆":"🎉"):"💔"}</div><h1>${win?(m==="review"?"Wiederholung geschafft!":"Lektion geschafft!"):"Keine Herzen mehr"}</h1>
${win?`<div class="statgrid"><div><b>+${xp}</b><small>XP</small></div><div><b>${acc} %</b><small>auf Anhieb richtig</small></div><div><b>💡 ${L.hinted}</b><small>mit Tipp</small></div></div>${heart?"<p>❤️ +1 Herz fürs Wiederholen</p>":""}`
:`<p>Beim Wiederholen verlierst du keine Herzen und bekommst pro Runde eins zurück.</p>`}
<div class="col"><button class="btn" onclick="home()">Weiter</button>${win?"":`<button class="btn sec" onclick="review()">🔁 Wiederholen</button>`}</div></div>`;
L=null;
}
function stats(){
L=null;const seen=ALL.filter(q=>S.cards[q.id]).length;
app.innerHTML=hud()+`<h2>📊 Dein Fortschritt</h2><div class="statgrid"><div><b>${fmt(S.xp)}</b><small>XP gesamt</small></div><div><b>🔥 ${streakNow()}</b><small>Tage in Folge</small></div><div><b>${seen}/${ALL.length}</b><small>Fragen gesehen</small></div></div>
${C.map(c=>`<div class="sc" style="--c:${c.color}"><h3>${c.icon} ${c.title}</h3>${c.lessons.map(l=>`<div class="srow"><span>${l.title}</span><div class="bar"><div style="width:${pct(l.qs)}%;background:${c.color}"></div></div><b>${pct(l.qs)} %</b></div>`).join("")}</div>`).join("")}
<h3>⚙️ Einstellungen</h3>
<label class="set"><input type="checkbox" ${S.unlockAll?"checked":""} onchange="S.unlockAll=this.checked;save()"> Alle Lektionen freischalten</label>
<div class="setbtns"><button class="btn sec" onclick="exportData()">Fortschritt exportieren</button><button class="btn sec" onclick="importData()">Importieren</button><button class="btn red" onclick="resetAll()">Alles zurücksetzen</button></div>
<p style="color:#999;font-size:12px;margin-top:24px">„% gemeistert“ steigt, je öfter du eine Frage hintereinander ohne Tipp richtig beantwortest. Wiederholt wird nach 1, 2, 4, 8, 16 und 32 Tagen. Eine falsche Antwort setzt die Frage zurück, mit Tipp richtig beantwortete Fragen kommen früher wieder.</p>`+nav("stats");
}
function exportData(){prompt("Kopiere diesen Code und füge ihn auf dem anderen Gerät unter „Importieren“ ein:",JSON.stringify(S))}
function importData(){const t=prompt("Fortschritts-Code hier einfügen:");if(!t)return;try{Object.assign(S,JSON.parse(t));save();stats();alert("Fortschritt importiert ✔")}catch(e){alert("Der Code ist ungültig.")}}
function resetAll(){if(confirm("Wirklich den gesamten Fortschritt löschen?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}
document.addEventListener("keydown",e=>{
if(!L)return;
if(/^[1-5]$/.test(e.key)&&!L.checked){const b=$$(".opt")[+e.key-1];if(b)pickOpt(b)}
else if(e.key.toLowerCase()==="h")showHint();
else if(e.key==="Enter"){const b=$("#foot .btn");if(b&&!b.disabled){e.preventDefault();b.click()}}
});
home();
</script>
<script>

n:"Ohne Engpass: alle Produkte mit positivem Stück-DB bis zur Absatzgrenze fertigen."},

{ id:"st-ust", area:"Steuerrecht", icon:"🧾", title:"Umsatzsteuer-Voranmeldung März 2026", topic:"Umsatzsteuer",
sv:`Unternehmer U betreibt in Köln ein Maschinenbau- und Beratungsunternehmen (Regelbesteuerung, Sollversteuerung, monatliche Voranmeldung). Im <b>März 2026</b>:<br>
a) U verkauft eine Maschine für <b>50.000 €</b> an Unternehmer B in Lyon (gültige französische USt-IdNr.). U befördert die Maschine selbst nach Frankreich; alle Nachweise liegen vor.<br>
b) U berät die Privatperson P aus Bonn und erhält <b>2.380 € brutto</b>.<br>

["331 €","Die Bewirtungs-Vorsteuer wurde unzulässig auf 70 % gekürzt."]],

{ id:"st-gewst-35", area:"Steuerrecht", icon:"🔧", title:"Einzelunternehmer: GewSt & § 35 EStG", topic:"Gewerbesteuer & Einkommensteuer",
sv:`Einzelunternehmer E betreibt einen Großhandel. Gewinn aus Gewerbebetrieb 2026: <b>120.000 €</b>. Darin sind als Betriebsausgaben enthalten: Schuldzinsen <b>240.000 €</b> und Miete für eine Lagerhalle <b>80.000 €</b>. Weitere Hinzurechnungen oder Kürzungen gibt es nicht. Hebesatz: <b>420 %</b>.<br><br>

let K=null;
(function(){
Object.keys(PLUS_LESSONS).forEach(area=>{
const ci=C.findIndex(c=>c.short===area);
if(ci<0)return;
PLUS_LESSONS[area].forEach(l=>{
if(C[ci].lessons.some(x=>x.title===l.title))return;

l.qs.forEach(q=>{q.id=hash(q.q);q.ci=ci;q.li=li;ALL.push(q)});
});
});
PLUS_CASES.forEach(f=>{f.ci=C.findIndex(c=>c.short===f.area)});
S.cases=S.cases||{};
document.head.insertAdjacentHTML("beforeend",`<style>

function nav(a){const d=dueList().length;return`<nav class="nav">
<button class="${a==="learn"?"on":""}" onclick="home()">🏠<small>Lernen</small></button>
<button class="${a==="cases"?"on":""}" onclick="cases()">📝<small>Fälle</small></button>
<button class="${a==="review"?"on":""}" onclick="review()">🔁<small>Wiederholen${d?`<span class="badge">${d}</span>`:""}</small></button>
<button class="${a==="stats"?"on":""}" onclick="stats()">📊<small>Statistik</small></button></nav>`}
function cases(){
L=null;K=null;const c=C[tab],list=PLUS_CASES.filter(f=>f.ci===tab);
app.innerHTML=hud()+`<div class="tabs">${C.map((x,i)=>`<button class="tab ${i===tab?"on":""}" style="--c:${x.color}" onclick="tab=${i};cases()">${x.icon} ${x.short}</button>`).join("")}</div>
<div class="banner" style="--c:${c.color}"><h2>📝 Klausurfälle</h2><div>Mehrstufige Fälle wie in der Klausur. Nach jedem Schritt siehst du die richtige Lösung und rechnest mit dem korrekten Zwischenergebnis weiter. Hier verlierst du keine Herzen.</div></div>
${list.length?list.map(f=>{const b=S.cases[f.id];return`<div class="casecard" style="--c:${c.color}" onclick="startCase('${f.id}')"><div class="ci">${f.icon}</div><div><b>${f.title}</b><small>${f.topic} · ${f.steps.length} Schritte${b!==undefined?` · Bestwert ${b}/${f.steps.length}`:""}</small></div><span class="arr">›</span></div>`}).join(""):"<p>Für dieses Kapitel gibt es noch keine Fälle.</p>"}`+nav("cases");
window.scrollTo(0,0);
}
function startCase(id){const f=PLUS_CASES.find(x=>x.id===id);if(!f)return;L=null;K={f,i:0,res:[],sel:null,checked:false,hint:false};renderStep()}
function renderStep(){
const f=K.f,st=f.steps[K.i],c=C[f.ci],ord=shuffle(st.o.map((_,i)=>i));
K.sel=null;K.checked=false;K.hint=false;
app.innerHTML=`<div class="top"><button class="x" onclick="quitCase()">✕</button><div class="bar"><div style="width:${K.i/f.steps.length100}%"></div></div><span class="hh" style="color:${c.color}">${K.i+1}/${f.steps.length}</span></div>
<details class="sv" ${K.i===0?"open":""}><summary>📄 Sachverhalt: ${f.title}${K.i>0?" (antippen zum Aufklappen)":""}</summary><div style="margin-top:8px">${f.sv}</div></details>
${K.res.length?`<div class="zw"><b>Bisherige Ergebnisse:</b>${K.res.map((r,j)=>`<div>${r.ok?"✅":"❌"} ${j+1}. ${f.steps[j].o[0][0]}</div>`).join("")}</div>`:""}
<div class="card"><div class="tag" style="color:${c.color}">${f.icon} Schritt ${K.i+1} von ${f.steps.length}</div><h2 class="q">${st.q}</h2>
<button id="hb" class="hintbtn" onclick="hintStep()">💡 Tipp zur Herangehensweise</button><div id="hint" class="hint" hidden>💡 <b>Herangehensweise:</b> ${st.h}</div>
<div class="opts">${ord.map((i,k)=>`<div class="opt" data-v="${i}"><span class="key">${"ABCDE"[k]}</span><div><div>${st.o[i][0]}</div><div class="why" hidden></div></div></div>`).join("")}</div></div>
<div id="foot" class="foot"><div class="fi"><span class="kbd">Tasten: 1–4 wählen · H Tipp · Enter prüfen</span><button id="chk" class="btn" disabled onclick="checkStep()">Prüfen</button></div></div>`;
$$(".opt").forEach(b=>b.onclick=()=>pickStep(b));
window.scrollTo(0,0);
}
function pickStep(b){if(!K||K.checked)return;$$(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");K.sel=+b.dataset.v;$("#chk").disabled=false}
function hintStep(){const h=$("#hint");if(!K||!h)return;h.hidden=false;$("#hb").hidden=true;if(!K.checked)K.hint=true}
function checkStep(){
if(!K||K.checked||K.sel===null)return;
const st=K.f.steps[K.i];K.checked=true;const ok=K.sel===0;
$$(".opt").forEach(b=>{const v=+b.dataset.v,w=b.querySelector(".why");
b.classList.remove("sel");b.classList.add(v===0?"right":v===K.sel?"wrongsel":"dim");
w.innerHTML=`<b>${v===0?"✅ Stimmt:":"❌ Passt nicht:"}</b> ${st.o[v][1]}`;w.hidden=false});
K.res.push({ok,hint:K.hint});
const last=K.i+1>=K.f.steps.length,f=$("#foot");f.className="foot "+(ok?"ok":"bad");
f.innerHTML=`<div class="fi"><div class="msg"><h3>${ok?pick(["Richtig! ✅","Super! 🎉","Klasse! 💪","Genau! 🎯"]):"Leider falsch ❌"}</h3>${ok?"":`<p><b>Richtig ist:</b> ${st.o[0][0]}. Damit geht es weiter.</p>`}${st.n?`<p>📌 <b>Merke:</b> ${st.n}</p>`:""}</div><button class="btn" onclick="nextStep()">${last?"Auswertung":"Nächster Schritt"}</button></div>`;
$(".top .bar>div").style.width=((K.i+1)/K.f.steps.length100)+"%";
$(".opts").scrollIntoView({behavior:"smooth",block:"start"});
}
function nextStep(){if(!K)return;K.i++;if(K.i>=K.f.steps.length)return endCase();renderStep()}
function quitCase(){if(confirm("Fall wirklich abbrechen?"))cases()}
function endCase(){
const f=K.f,n=f.steps.length,sc=K.res.filter(r=>r.ok).length,hints=K.res.filter(r=>r.hint).length;
let xp=0;K.res.forEach(r=>{if(r.ok)xp+=r.hint?2:4});if(K.res.every(r=>r.ok&&!r.hint))xp+=10;
if(xp)addXp(xp);
S.cases[f.id]=Math.max(S.cases[f.id]||0,sc);save();
const c=C[f.ci];
app.innerHTML=`<div class="end" style="padding-top:30px"><div class="big">${sc===n?"🏆":sc>=n/2?"🎉":"📚"}</div><h1>Fall abgeschlossen</h1>
<div class="statgrid"><div><b>${sc}/${n}</b><small>Schritte richtig</small></div><div><b>+${xp}</b><small>XP</small></div><div><b>💡 ${hints}</b><small>Tipps genutzt</small></div></div></div>
<div class="sc" style="--c:${c.color}"><h3>📋 Lösungsübersicht: ${f.title}</h3>${f.steps.map((s,j)=>`<p style="font-size:14px;margin:10px 0;line-height:1.45">${K.res[j].ok?"✅":"❌"} <b>${j+1}.</b> ${s.q}<br>→ <b>${s.o[0][0]}</b><br><span style="color:#777">${s.o[0][1]}</span></p>`).join("")}</div>
<div class="col"><button class="btn" onclick="cases()">Weiter</button><button class="btn sec" onclick="startCase('${f.id}')">Fall wiederholen</button></div>`;
K=null;window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
if(!K)return;
if(/^[1-5]$/.test(e.key)&&!K.checked){const b=$$(".opt")[+e.key-1];if(b)pickStep(b)}
else if(e.key.toLowerCase()==="h")hintStep();
else if(e.key==="Enter"){const b=$("#foot .btn");if(b&&!b.disabled){e.preventDefault();b.click()}}
});
home();
</script>
